
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    scrapeInterval: 15s
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

  additionalServiceMonitors:
    api:
      namespaceSelector:
        matchNames: [shop]
      selector:
        matchLabels:
          app.kubernetes.io/name: api
      endpoints:
        - port: http
          path: /metrics

grafana:
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: lab
          folder: Lab 2
          type: file
          options:
            path: /var/lib/grafana/dashboards/lab
  dashboards:
    lab:
      api-red:
        json: |
          {
            "uid": "api-red",
            "title": "api — RED",
            "tags": ["lab2"],
            "schemaVersion": 39,
            "refresh": "10s",
            "time": { "from": "now-15m", "to": "now" },
            "panels": [
              {
                "id": 1,
                "type": "timeseries",
                "title": "Rate — запросы в секунду по ручкам",
                "gridPos": { "h": 9, "w": 12, "x": 0, "y": 0 },
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "sum by (route) (rate(http_requests_total{namespace=\"shop\", job=\"api\"}[$__rate_interval]))",
                    "legendFormat": "{{route}}"
                  }
                ]
              },
              {
                "id": 2,
                "type": "timeseries",
                "title": "Errors — доля ответов 5xx",
                "gridPos": { "h": 9, "w": 12, "x": 12, "y": 0 },
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0 }, "overrides": [] },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "sum(rate(http_request_errors_total{namespace=\"shop\", job=\"api\"}[$__rate_interval])) / sum(rate(http_requests_total{namespace=\"shop\", job=\"api\"}[$__rate_interval]))",
                    "legendFormat": "доля 5xx"
                  }
                ]
              },
              {
                "id": 3,
                "type": "timeseries",
                "title": "Duration — p95 времени ответа",
                "gridPos": { "h": 9, "w": 12, "x": 0, "y": 9 },
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"shop\", job=\"api\"}[$__rate_interval])))",
                    "legendFormat": "все запросы"
                  },
                  {
                    "refId": "B",
                    "expr": "histogram_quantile(0.95, sum by (le, route) (rate(http_request_duration_seconds_bucket{namespace=\"shop\", job=\"api\"}[$__rate_interval])))",
                    "legendFormat": "{{route}}"
                  }
                ]
              },
              {
                "id": 4,
                "type": "timeseries",
                "title": "Запросы в секунду по подам",
                "gridPos": { "h": 9, "w": 12, "x": 12, "y": 9 },
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "sum by (pod) (rate(http_requests_total{namespace=\"shop\", job=\"api\"}[$__rate_interval]))",
                    "legendFormat": "{{pod}}"
                  }
                ]
              }
            ]
          }
