apiVersion: v1
kind: Pod
metadata:
  name: bad-privileged
  labels:
    app.kubernetes.io/name: bad
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: api
      image: shop.local/api:0.1.0
      securityContext:
        privileged: true
      resources:
        limits:
          cpu: 100m
          memory: 64Mi
