# Стек из лабы 2: тот же чарт kube-prometheus-stack 92.14.0 и те же values
# (lab-2/monitoring/kube-prometheus-stack.yaml), из которых убрано то, что в лабе 3 переехало
# в чарт shop: ServiceMonitor для api, три алерта и дашборд. Loki и Jaeger здесь не поднимаем,
# поэтому их datasources тоже нет. Добавлен только sidecar.dashboards.searchNamespace,
# чтобы Grafana подхватила дашборд ConfigMap-ом из namespace shop.

kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

defaultRules:
  disabled:
    NodeClockNotSynchronising: true

prometheus:
  prometheusSpec:
    scrapeInterval: 15s
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

alertmanager:
  config:
    route:
      receiver: webhook
      group_by: [alertname, namespace]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
    receivers:
      - name: "null"
      - name: webhook
        webhook_configs:
          - url: http://alert-webhook.monitoring.svc:8080/alerts
            send_resolved: true

extraManifests:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: alert-webhook
      labels:
        app.kubernetes.io/name: alert-webhook
    spec:
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: alert-webhook
      template:
        metadata:
          labels:
            app.kubernetes.io/name: alert-webhook
        spec:
          containers:
            - name: echo
              image: mendhak/http-https-echo:42
              env:
                - name: LOG_WITHOUT_NEWLINE
                  value: "true"
              ports:
                - name: http
                  containerPort: 8080
  - apiVersion: v1
    kind: Service
    metadata:
      name: alert-webhook
      labels:
        app.kubernetes.io/name: alert-webhook
    spec:
      selector:
        app.kubernetes.io/name: alert-webhook
      ports:
        - name: http
          port: 8080
          targetPort: http

grafana:
  sidecar:
    dashboards:
      searchNamespace: ALL
