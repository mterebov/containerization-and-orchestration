apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
spec:
  type: NodePort                      # доступ с мака без port-forward, пригодится в части 4
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: {{ .Values.api.service.nodePort }}
