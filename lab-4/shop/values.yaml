# Все ручки чарта. Шаблоны читают только отсюда: то, чего здесь нет, в шаблоне захардкожено.
api:
  image:
    repository: shop.local/api   # образ грузится в kind, реестр в имени нужен правилу restrict-registry
    tag: "0.3.0"                 # bump этого значения = rolling update
  replicas: 2                    # в кластере лабы 4 две ноды: по реплике на ноду
  healthFail: "false"            # "true" ломает /health, нужно для сломанной версии
  # Как разносить реплики по нодам. Шаблон shop.spread в _helpers.tpl рендерит одно из двух:
  #   topologySpreadConstraints: держать баланс, разница в числе реплик между нодами не больше maxSkew;
  #   podAntiAffinity: запрет соседства, две реплики на одной ноде не ставить.
  spread:
    mechanism: topologySpreadConstraints   # или podAntiAffinity
    topologyKey: kubernetes.io/hostname    # домен разнесения: нода (в облаке была бы зона)
    maxSkew: 1                             # только для topologySpreadConstraints
    hard: true                   # true: правило нельзя нарушить, под ждёт в Pending; false: только подсказка при выборе ноды
  # Числа из krr (часть 3, 50 заказов/с 15 минут): CPU 10m, память 100Mi request = limit.
  # Это его минимумы: реально под нагрузкой ~5m и ~10Mi. CPU limit krr советует не ставить,
  # но require-limits его требует, поэтому оставлен прежний.
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
    limits:
      cpu: 200m
      memory: 100Mi
  service:
    nodePort: 30080              # совпадает с extraPortMappings в kind.yaml

worker:
  image:
    repository: shop.local/worker   
    tag: "0.1.0"                 
  replicas: 2
  healthFail: "false"
  resources:                     # из krr, как у api: его минимумы 10m / 100Mi, реально <1m и ~9Mi
    requests:
      cpu: 10m
      memory: 100Mi
    limits:
      cpu: 200m
      memory: 100Mi

batch:
  image:
    repository: shop.local/batch
    tag: "0.1.0"
  replicas: 2
  cpuWorkers: 1                  # горутин, жгущих CPU; каждая хочет целое ядро, limits.cpu её режет
  memoryMB: 64                   # сколько памяти держать
  memoryStepMB: 8                # с какой скоростью набирать память, МБ/с: медленно, чтобы kubelet успел заметить нехватку
  resources:                     # фоновая работа: требует немного, но может разогнаться до limits
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

postgres:
  instances: 1                  # одна нода postgres, без реплик: kind на ноутбуке
  storage: 1Gi
  # krr не видит поды CloudNativePG, посчитано его же формулой в Prometheus:
  # CPU p95 = 9.4m -> 10m. Память max + 15% = 97Mi, но берём 256Mi: в postgres
  # shared_buffers = 128MB, этот кеш заполняется по мере роста таблиц, а за час
  # истории с маленькой таблицей krr его просто не увидел.
  resources:
    requests:
      cpu: 10m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 256Mi

monitoring:
  enabled: true                  # ServiceMonitor и PrometheusRule рендерятся, только если в кластере есть их CRD
  alerts:
    errorRate: 0.05              # доля 5xx, выше которой ApiHighErrorRate
    errorRateFor: 2m
    ordersStuckFor: 2m
    replicasUnavailableFor: 3m
