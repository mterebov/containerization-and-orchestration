# Все ручки чарта. Шаблоны читают только отсюда: то, чего здесь нет, в шаблоне захардкожено.

# Классы приоритета (часть 5): кого планировщик вытесняет ради места (preemption) и кого
# kubelet выселяет первым при нехватке памяти. Поды без класса (worker, мониторинг,
# Kyverno) получают приоритет 0.
priorityClasses:
  shop-critical:
    value: 1000000                 # путь заказа: api и postgres
    description: "shop: критичный путь заказа, api и postgres"
  shop-batch:
    value: -100                    # ниже всех, даже подов без класса: под давлением batch уходит первым
    preemptionPolicy: Never        # и сам никого не вытесняет, а ждёт места в Pending
    description: "shop: фоновая аналитика, жертвуем первой"

api:
  image:
    repository: shop.local/api   # образ грузится в kind, реестр в имени нужен правилу restrict-registry
    tag: "0.3.0"                 # bump этого значения = rolling update
  replicas: 2                    # в кластере лабы 4 две ноды: по реплике на ноду
  healthFail: "false"            # "true" ломает /health, нужно для сломанной версии
  # Как разносить реплики по нодам. Шаблон shop.spread в _helpers.tpl рендерит одно из двух:
  #   topologySpreadConstraints: держать баланс, разница в числе реплик между нодами не больше maxSkew;
  #   podAntiAffinity: запрет соседства, две реплики на одной ноде не ставить.
  spread:
    mechanism: topologySpreadConstraints   # или podAntiAffinity
    topologyKey: kubernetes.io/hostname    # домен разнесения: нода (в облаке была бы зона)
    maxSkew: 1                             # только для topologySpreadConstraints
    hard: true                   # true: правило нельзя нарушить, под ждёт в Pending; false: только подсказка при выборе ноды
  priorityClassName: shop-critical
  # Guaranteed (часть 5): requests = limits на числах из krr (часть 3). Память 100Mi как есть.
  # CPU krr дал как request (95-й перцентиль минутных средних, под нагрузкой ~6m, его минимум 10m),
  # а в Guaranteed он становится и потолком, который режет каждые 100 мс: всплески внутри минуты
  # (сборка мусора, сбор метрик) krr не видит. Поэтому CPU с запасом в 2 раза: 20m.
  resources:
    requests:
      cpu: 20m
      memory: 100Mi
    limits:
      cpu: 20m
      memory: 100Mi
  pdb:
    enabled: true
    minAvailable: 1                # из двух реплик добровольно выселить можно только одну
  service:
    nodePort: 30080              # совпадает с extraPortMappings в kind.yaml

worker:
  image:
    repository: shop.local/worker   
    tag: "0.1.0"                 
  replicas: 2
  healthFail: "false"
  resources:                     # из krr, как у api: его минимумы 10m / 100Mi, реально <1m и ~9Mi
    requests:
      cpu: 10m
      memory: 100Mi
    limits:
      cpu: 200m
      memory: 100Mi

batch:
  image:
    repository: shop.local/batch
    tag: "0.1.0"
  # Часть 6: реплик больше, чем помещается. По requests (250m) влезает 7: две на control plane,
  # пять на worker, остальные ждут в Pending.
  replicas: 10
  # Часть 6: batch не жжёт CPU, чтобы было видно, что планировщик смотрит на requests, а не на
  # реальную загрузку: ноды почти простаивают, а места для новых подов нет. Обычно 1.
  cpuWorkers: 0                  # горутин, жгущих CPU; каждая хочет целое ядро, limits.cpu её режет
  # В части 7 здесь было 400: втрое больше request (128Mi), но в пределах limit (1Gi). Пять batch
  # на worker вместе с Prometheus и Grafana не влезали в его 2.75Gi, и kubelet их выселял.
  # После опыта вернули 64.
  memoryMB: 64                   # сколько памяти держать
  # В части 7 было 2: пять подов на worker по 2 МБ/с = 10 МБ/с, и от порога выселения до
  # жёсткого предела подов на ноде (512Mi) почти минута, чтобы kubelet успел выселить сам.
  memoryStepMB: 8                # с какой скоростью набирать память, МБ/с
  priorityClassName: shop-batch
  # Burstable (часть 5): requests сильно ниже limits. Резервирует мало, а разогнаться может
  # до целого ядра и гигабайта. Всё, что сверх requests, ему не гарантировано.
  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi

postgres:
  instances: 1                  # одна нода postgres, без реплик: kind на ноутбуке
  storage: 1Gi
  priorityClassName: shop-critical
  # krr не видит поды CloudNativePG, посчитано его же формулой в Prometheus:
  # CPU p95 = 9.4m -> 10m. Память max + 15% = 97Mi, но берём 256Mi: в postgres
  # shared_buffers = 128MB, этот кеш заполняется по мере роста таблиц, а за час
  # истории с маленькой таблицей krr его просто не увидел.
  # Guaranteed (часть 5): requests = limits. Сначала CPU взяли 20m (9.4m из krr с запасом в 2 раза),
  # и в части 7 база от этого упала: потолок резал её в 99% интервалов по 100 мс, менеджер
  # инстанса CloudNativePG (он живёт в том же контейнере) не успевал отвечать на пробы по HTTPS,
  # kubelet перезапускал контейнер, и /order отвечал 503. В средних за минуту krr видел ~10m,
  # а за 30 секунд пики доходили до 34m, внутри 100 мс ещё выше. Для потолка нужен пик, а не
  # перцентиль средних: 200m.
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 256Mi
  pdb:
    enabled: true                  # свой PDB вместо операторского (enablePDB: false в Cluster)
    minAvailable: 1                # единственный инстанс базы добровольно не выселяется вообще

monitoring:
  enabled: true                  # ServiceMonitor и PrometheusRule рендерятся, только если в кластере есть их CRD
  alerts:
    errorRate: 0.05              # доля 5xx, выше которой ApiHighErrorRate
    errorRateFor: 2m
    ordersStuckFor: 2m
    replicasUnavailableFor: 3m
